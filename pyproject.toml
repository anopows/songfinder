[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "songfinder"
version = "0.1.0"
description = "Find the exact recording behind a noisy, speed-altered clip"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.scripts]
songfinder = "songfinder.cli:main"

[tool.setuptools]
packages = ["songfinder"]

[tool.setuptools.package-data]
songfinder = ["static/*"]
