<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Songfinder · private debug</title><style>
:root{color-scheme:dark;--bg:#0C0C0E;--s1:#18181C;--line:#303037;--tx:#F4F2EC;--mu:#8F8E96;--so:#B9B7BF;
--brass:#E8B44C;--ink:#1D1404;--warm:#F2D18B;--ok:#9ED7AE;--red:#F09A85;
--display:"Arial Black","Helvetica Neue",system-ui,sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:460px;margin:0 auto;padding:20px 20px 32px;display:flex;flex-direction:column;gap:18px;min-height:100dvh}
a{color:var(--brass);text-decoration:none}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.logo{font:900 19px/1 var(--display);letter-spacing:-.04em;color:var(--tx);padding:12px 0;display:inline-block}.logo i{font-style:normal;color:var(--brass)}
h1{margin:0;font:900 34px/1.04 var(--display);letter-spacing:-.03em;overflow-wrap:anywhere}
p{margin:0}.soft{color:var(--so);font-size:15px;line-height:1.45}.small{color:var(--mu);font-size:13px;line-height:1.5}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--s1);color:var(--tx);font:650 16px system-ui,sans-serif;cursor:pointer;width:100%}
.btn.brass{background:var(--brass);border-color:var(--brass);color:var(--ink);font-weight:700}
.btn:disabled{opacity:.45;cursor:default}
label{font-size:13px;font-weight:650;color:var(--so);display:block;margin-bottom:6px}
input[type=text]{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--s1);color:var(--tx);padding:0 14px;font:16px system-ui,sans-serif}
.card{padding:14px;border-radius:14px;background:var(--s1);display:flex;flex-direction:column;gap:6px}
.cap{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.big{font:900 32px/1 var(--display);letter-spacing:-.03em}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.steps{padding:4px 16px;border-radius:16px;background:var(--s1)}
.steps div{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);font-size:15px;font-weight:650}
.steps div:last-child{border-bottom:0;color:var(--warm)}
.dot{width:18px;height:18px;border-radius:50%;flex:none;border:2.4px solid var(--ok);background:var(--ok)}
.steps div:last-child .dot{background:none;border-color:var(--brass);border-right-color:rgba(232,180,76,.25);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.steps div:last-child .dot{animation:none}}
.tag{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tip{padding:12px 14px;border-radius:12px;background:rgba(232,180,76,.14);color:var(--warm);font-size:14px;line-height:1.45}
.msg{padding:12px 14px;border-radius:12px;background:rgba(240,154,133,.12);border:1px solid rgba(240,154,133,.35);color:var(--red);font-size:14px;line-height:1.45}
.links{display:flex;flex-direction:column;gap:8px}
progress{width:100%;height:6px;accent-color:var(--brass)}
main{max-width:800px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}audio{width:100%}</style></head><body><main>
<a class="logo" href="/">song<i>·</i>finder</a><h1>Private debug</h1><p class="small">Audio expires after 14 days. Results expire after 90 days.</p>
<form id="login" class="card"><label for="password">Admin password</label><input id="password" type="password" autocomplete="current-password" required style="font:inherit;padding:12px"><div id="verify"></div><button id="signin" class="btn brass" disabled>Sign in</button></form><p id="message" class="small" aria-live="polite"></p><div id="clips" class="links"></div>
<script>
const $=id=>document.getElementById(id);let token="",widget;
async function req(path,body){const r=await fetch(path,body?{method:"POST",headers:{"Content-Type":"application/json","X-Songfinder":"1"},body:JSON.stringify(body)}:{});const j=await r.json();if(!r.ok)throw new Error(j.error);return j}
async function load(){const data=await req("/api/admin/clips");$("login").hidden=true;$("message").textContent="";$("clips").replaceChildren();for(const c of data.clips){
 const box=document.createElement("article");box.className="card";const title=document.createElement("a");title.href="/c/"+c.id;title.textContent=c.name||c.id;
 const p=document.createElement("p");p.className="small";const result=JSON.parse(c.result);p.textContent=new Date(c.created*1000).toLocaleString()+" · "+c.status+" · "+(result.title||result.verdict||"")+" · feedback: "+(c.feedback||"none");box.append(title,p);
 if(Date.now()/1000-c.created<14*86400){const audio=document.createElement("audio");audio.controls=true;audio.preload="none";audio.src="/api/admin/clips/"+c.id+"/audio";box.append(audio)}
 const details=document.createElement("details"),summary=document.createElement("summary"),pre=document.createElement("pre");summary.textContent="Evidence and processing details";details.append(summary,pre);details.ontoggle=async()=>{if(details.open&&!pre.textContent){try{pre.textContent=JSON.stringify(await req("/api/admin/clips/"+c.id),null,2)}catch(e){pre.textContent=e.message}}};box.append(details);$("clips").append(box);
}}
$("login").onsubmit=async e=>{e.preventDefault();try{await req("/api/admin/login",{password:$("password").value,token});$("password").value="";await load()}catch(e){$("message").textContent=e.message;if(window.turnstile){token="";$("signin").disabled=true;turnstile.reset(widget)}}};
(async()=>{try{await load()}catch(e){const b=await req("/api/bootstrap");if(b.site_key){window.ready=()=>{widget=turnstile.render("#verify",{sitekey:b.site_key,theme:"dark",callback:t=>{token=t;$("signin").disabled=false},"expired-callback":()=>{token="";$("signin").disabled=true}})};const s=document.createElement("script");s.src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=ready&render=explicit";document.head.append(s)}else{$("signin").disabled=false}}})();
</script></main></body></html>
